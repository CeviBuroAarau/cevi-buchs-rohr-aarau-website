name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: "Build, Test, Release & Docker"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Use Node.js 26.x
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 26.x
        cache: npm

    - name: Install Dependencies
      run: npm ci

    - name: Set build metadata
      id: meta
      run: |
        echo "revision=sha-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
        echo "created=$(date -u +'%d.%m.%Y %H:%M:%S')" >> $GITHUB_OUTPUT
        echo "created_iso=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
        IMAGE="ghcr.io/${{ github.repository }}"
        echo "image=${IMAGE,,}" >> $GITHUB_OUTPUT
        # Only semver tags count; the legacy integer tags (v1 … v48) are ignored
        PREV_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
        PREV="${PREV_TAG#v}"
        IFS=. read -r MAJOR MINOR PATCH <<< "${PREV:-0.0.0}"
        case "${{ inputs.bump }}" in
          major) VERSION="$((MAJOR + 1)).0.0" ;;
          minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
          patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
        esac
        if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
          echo "::error::Tag v${VERSION} already exists"
          exit 1
        fi
        echo "Releasing v${VERSION} (previous: ${PREV_TAG:-none})"
        echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "version_minor=v${VERSION%.*}" >> $GITHUB_OUTPUT
        echo "version_major=v${VERSION%%.*}" >> $GITHUB_OUTPUT

    - name: Set env variables
      run: |
        sed -i 's#VITE_DATE=Not specified#VITE_DATE=${{ steps.meta.outputs.created }}#g' .env
        sed -i 's#VITE_REVISION=Not specified#VITE_REVISION=${{ steps.meta.outputs.revision }}#g' .env
        sed -i 's#VITE_VERSION=Not specified#VITE_VERSION=${{ steps.meta.outputs.version }}#g' .env

    - name: Build
      run: npm run build

    - name: Unit Tests
      run: npm run test:unit

    - name: Archive unit test coverage report
      uses: actions/upload-artifact@v7
      with:
        name: unit test coverage report
        path: coverage

    - name: Install Playwright browsers
      run: npx playwright install chromium --with-deps

    - name: E2E Tests
      run: npm run test:e2e

    - name: Archive E2E test report
      uses: actions/upload-artifact@v7
      with:
        name: e2e test report
        path: tests/e2e/reports

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}

    - name: Copy dist for Docker build
      run: cp -r dist docker/github/dist

    - name: Build and push Docker image
      uses: docker/build-push-action@v7.4.0
      with:
        context: docker/github
        file: docker/github/Dockerfile
        push: true
        tags: |
          ${{ steps.meta.outputs.image }}:stable
          ${{ steps.meta.outputs.image }}:v${{ steps.meta.outputs.version }}
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version_minor }}
          ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version_major }}
        labels: |
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.created=${{ steps.meta.outputs.created_iso }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        PREV_TAG="${{ steps.meta.outputs.prev_tag }}"
        if [ -n "$PREV_TAG" ]; then
          NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
        else
          NOTES=$(git log --pretty=format:"- %s" --no-merges)
        fi
        gh release create "v${{ steps.meta.outputs.version }}" \
          --title "Release v${{ steps.meta.outputs.version }}" \
          --notes "$NOTES" \
          --latest
