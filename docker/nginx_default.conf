server {
	listen 80 default_server;
	listen [::]:80 default_server;

	add_header Content-Security-Policy "default-src 'self' https://cms.cevi-buro-aarau.ch data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https://wmts.geo.admin.ch https://cms.cevi-buro-aarau.ch; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://statistics.cevi-buro-aarau.ch; connect-src 'self' https://cms.cevi-buro-aarau.ch https://statistics.cevi-buro-aarau.ch" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
	add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
	server_tokens off;

	gzip on;
	gzip_disable "msie6";
	gzip_vary on;
	gzip_proxied any;
	gzip_comp_level 6;
	gzip_buffers 16 8k;
	gzip_http_version 1.1;
	gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

	root /usr/share/nginx/html;
	index index.html;

	# add_header in a location replaces the server-level headers, so every
	# location that sets Cache-Control repeats the security headers.

	# index.html references the hashed bundles and must always be revalidated,
	# otherwise the browser keeps loading the bundles of an old deployment.
	location ~* \.html$ {
		add_header Cache-Control "no-cache" always;
		add_header Content-Security-Policy "default-src 'self' https://cms.cevi-buro-aarau.ch data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https://wmts.geo.admin.ch https://cms.cevi-buro-aarau.ch; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://statistics.cevi-buro-aarau.ch; connect-src 'self' https://cms.cevi-buro-aarau.ch https://statistics.cevi-buro-aarau.ch" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
	}

	# Vite adds a content hash to every file in /assets, so they never change.
	# ^~ keeps the regex locations below from matching these files.
	location ^~ /assets/ {
		try_files $uri =404;
		# without "always" so a missing chunk (404) is not cached
		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Content-Security-Policy "default-src 'self' https://cms.cevi-buro-aarau.ch data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https://wmts.geo.admin.ch https://cms.cevi-buro-aarau.ch; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://statistics.cevi-buro-aarau.ch; connect-src 'self' https://cms.cevi-buro-aarau.ch https://statistics.cevi-buro-aarau.ch" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
	}

	# Kill switch for the service worker of the former PWA build, see
	# public/service-worker.js. Must never be cached so browsers pick it up.
	location ~ ^/(service-worker|sw)\.js$ {
		add_header Cache-Control "no-cache" always;
		add_header Content-Security-Policy "default-src 'self' https://cms.cevi-buro-aarau.ch data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https://wmts.geo.admin.ch https://cms.cevi-buro-aarau.ch; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://statistics.cevi-buro-aarau.ch; connect-src 'self' https://cms.cevi-buro-aarau.ch https://statistics.cevi-buro-aarau.ch" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
	}

	# Files from public/ (images, favicon) keep their name across deployments.
	location ~* \.(png|jpg|jpeg|gif|ico|webp|svg)$ {
		add_header Cache-Control "public, max-age=86400";
		add_header Content-Security-Policy "default-src 'self' https://cms.cevi-buro-aarau.ch data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https://wmts.geo.admin.ch https://cms.cevi-buro-aarau.ch; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://statistics.cevi-buro-aarau.ch; connect-src 'self' https://cms.cevi-buro-aarau.ch https://statistics.cevi-buro-aarau.ch" always;
		add_header Strict-Transport-Security "max-age=31536000; includeSubdomains" always;
		add_header X-Content-Type-Options "nosniff" always;
		add_header Referrer-Policy "no-referrer" always;
		add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
