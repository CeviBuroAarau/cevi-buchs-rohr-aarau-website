openapi: 3.1.0
info:
  title: Backend
  version: '2.0'
  description: >-
    Payload backend for the Cevi Buchs-Rohr webpage. Only the parts used by the webpage are described. Examples follow
    real (shortened) responses, with persons and their pictures replaced by made-up data; the Lexical JSON of rich text
    fields is omitted.
  summary: Retrieve dynamic data for the Cevi Buchs-Rohr Webpage
  contact:
    name: Patrick Uhlmann
    url: https://cevi-buro-aarau.ch
    email: cevi-buro-api@cevimail.ch
  license:
    name: MIT
    url: https://raw.githubusercontent.com/patrickuhlmann/cevi-buchs-rohr-aarau-website/main/LICENSE
servers:
  - url: https://cms.cevi-buro-aarau.ch
  - url: http://localhost:3000
    description: Local backend
paths:
  /api/welcome-images:
    get:
      summary: Images displayed on the front page
      operationId: get-welcome-images
      parameters:
        - name: pagination
          in: query
          schema:
            type: boolean
          description: false returns all documents
        - name: depth
          in: query
          schema:
            type: integer
          description: 1 resolves uploads and relations to objects
        - name: sort
          in: query
          schema:
            type: string
          description: Field to sort by, prefix with - for descending (e.g. -date, _order)
        - name: where
          in: query
          style: deepObject
          explode: true
          schema:
            type: object
          description: Payload filter, e.g. where[date][greater_than_equal]=2026-09-26T00:00:00.000Z
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - docs
                properties:
                  docs:
                    type: array
                    items:
                      $ref: '#/components/schemas/WelcomeImage'
              examples:
                default:
                  value:
                    docs:
                      - id: 1
                        image:
                          id: 1189
                          title: null
                          url: https://cms.cevi-buro-aarau.ch/api/media/file/background1.webp
                          width: 2048
                          height: 1539
