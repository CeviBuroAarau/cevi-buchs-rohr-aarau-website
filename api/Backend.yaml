components:
  schemas:
    Upload:
      type: object
      required:
        - url
      properties:
        id:
          type: integer
        url:
          type: string
          description: Absolute URL of the original file
        title:
          type:
            - string
            - 'null'
        width:
          type:
            - integer
            - 'null'
        height:
          type:
            - integer
            - 'null'
        sizes:
          type: object
          properties:
            thumbnail:
              type: object
              description: 400 px WebP, url is null for images narrower than 400 px
              properties:
                url:
                  type:
                    - string
                    - 'null'
                width:
                  type:
                    - integer
                    - 'null'
                height:
                  type:
                    - integer
                    - 'null'
    Group:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
        name:
          type: string
    WelcomeImage:
      type: object
      required:
        - image
      properties:
        id:
          type: integer
        image:
          $ref: '#/components/schemas/Upload'
    Activity:
      type: object
      required:
        - title
        - image
