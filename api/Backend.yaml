  /api/form-contact:
    post:
      summary: Send the contact form
      operationId: post-form-contact
      description: Anonymous visitors may only create entries; the backend mails them to the section.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactForm'
            examples:
              default:
                value:
                  name: Me
                  email: me@me.ch
                  message: Wann ist der nächste Nachmittag?
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  doc:
                    type: object
              examples:
                default:
                  value:
                    message: Dokument erfolgreich erstellt.
                    doc:
                      id: 1
                      name: Me
                      email: me@me.ch
                      message: Wann ist der nächste Nachmittag?
        '400':
          description: Validation error
