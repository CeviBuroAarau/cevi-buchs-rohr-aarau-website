                        type: news
                        date: '2023-04-24T12:00:00.000Z'
                        source: Jahresbericht
                        descriptionHtml: >-
                          <div class="payload-richtext"><p><strong>Jahresbericht 2022</strong></p><p>Mit der
                          Waldweihnacht am 15. Januar hatten wir einen ungewöhnlichen Start ins Jahr. Gemütlich war es
                          trotzdem und auch etwas wärmer als im Dezember. Gemeinsam mit Schönenwerd führten wir in
                          Schafisheim das diesjährige Pfila durch...</p></div>
                        file:
                          id: 1126
                          title: null
                          url: https://cms.cevi-buro-aarau.ch/api/media/file/2022-Jahresbericht.pdf
                          width: null
                          height: null
                          sizes:
                            thumbnail:
                              url: null
                              width: null
                              height: null
                      - id: 12
                        type: news
                        date: '2022-02-19T12:00:00.000Z'
                        source: Jahresbericht
                        descriptionHtml: >-
                          <div class="payload-richtext"><p><strong>Jahresbericht 2021</strong></p><p>Leider mussten wir
                          auch das Jahr 2021 etwas langsam angehen. Wegen Corona führten wir vorerst nur unbetreute
                          Programme durch, welche von den Eltern mit Ihren Kindern einzeln oder in kleinen Gruppen
                          selbstständig absolviert wurden. Es startete mit einem Postenlauf im Wald wo man einen König
                          bastelte, ging dann weiter mit einem Postenlauf im Dorf (mit Action Bound).</p></div>
                        file:
                          id: 1125
                          title: null
                          url: https://cms.cevi-buro-aarau.ch/api/media/file/2021-Jahresbericht.pdf
                          width: null
                          height: null
                          sizes:
                            thumbnail:
